# SecretSpec contract for homepage widget secrets.
#
# Pass holds BARE names; Kubernetes (and the app) need HOMEPAGE_VAR_*.
# ref.item maps each logical key to its k8s entry, so one identifier
# works on both sides: `get` reads the Pass item, `set --provider kube`
# writes the HOMEPAGE_VAR_* entry. Pattern for future services: keys =
# source-of-truth names, ref.item = consumer-side names.
[project]
name = "homepage"
revision = "1.0"

[providers]
pass = "protonpass://secretspec"
kube = "k8s+secret://homepage-widgets"

[profiles.default]
HOMEASSISTANT_API_KEY = { description = "Home Assistant long-lived access token for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_HOMEASSISTANT_API_KEY" } }
IMMICH_API_KEY = { description = "Immich photos API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_IMMICH_API_KEY" } }
JELLYFIN_API_KEY = { description = "Jellyfin media server API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_JELLYFIN_API_KEY" } }
LIDARR_API_KEY = { description = "Lidarr music manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_LIDARR_API_KEY" } }
BAZARR_API_KEY = { description = "Bazarr subtitle manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_BAZARR_API_KEY" } }
PROWLARR_API_KEY = { description = "Prowlarr indexer manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_PROWLARR_API_KEY" } }
SONARR_API_KEY = { description = "Sonarr TV manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_SONARR_API_KEY" } }
RADARR_API_KEY = { description = "Radarr movie manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_RADARR_API_KEY" } }
READARR_API_KEY = { description = "Readarr book manager API key for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_READARR_API_KEY" } }
QBITTORRENT_USERNAME = { description = "qBittorrent Web UI username for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_QBITTORRENT_USERNAME" } }
QBITTORRENT_PASSWORD = { description = "qBittorrent Web UI password for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_QBITTORRENT_PASSWORD" } }
NEXTCLOUD_USERNAME = { description = "Nextcloud admin username for container setup and homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_NEXTCLOUD_USERNAME" } }
NEXTCLOUD_PASSWORD = { description = "Nextcloud admin password for the homepage widget (same credential as NEXTCLOUD_ADMIN_PASSWORD)", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_NEXTCLOUD_PASSWORD" } }
OMADA_USERNAME = { description = "TP-Link Omada controller username for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_OMADA_USERNAME" } }
OMADA_PASSWORD = { description = "TP-Link Omada controller password for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_OMADA_PASSWORD" } }
TECHNITIUM_USERNAME = { description = "Technitium DNS admin username for the homepage widget", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_TECHNITIUM_USERNAME" } }
TECHNITIUM_PASSWORD = { description = "Technitium DNS admin password for the homepage widget (same credential as TECHNITIUM_ADMIN_PASSWORD)", providers = ["pass", "kube"], ref = { item = "HOMEPAGE_VAR_TECHNITIUM_PASSWORD" } }
